name = "my-new-place"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Served at https://covlescu.com/my_new_place. The zone must be on Cloudflare.
# The pattern is more specific than a catch-all route, so it wins over any Worker already bound to covlescu.com.
routes = [{ pattern = "covlescu.com/my_new_place*", zone_name = "covlescu.com" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "my_new_place"
database_id = "5b1e6104-b4d6-411a-9018-cd02400d5f85"
migrations_dir = "migrations"

[vars]
# OAuth client id of a "Web application" credential in Google Cloud Console (public value, not a secret).
GOOGLE_CLIENT_ID = ""
# Optional comma-separated allow-list of emails. Empty = any verified Google account.
ALLOWED_EMAILS = ""
# Secret (set with `wrangler secret put SESSION_SECRET`): a long random string used to sign session cookies.
